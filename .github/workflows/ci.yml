name: Portfolio CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run repository validation
        run: node scripts/validate-site.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in assets/js/*.js; do
            node --check "$file"
          done
